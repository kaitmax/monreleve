<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!--
    web/app/icon.svg - the browser-tab icon, Next's file convention.

    THE RAIL MARK from the mon-releve-logo kit (identical geometry to
    public/favicon.svg): a track filled to about a third, stopping short of the
    40 % tick. It replaced the placeholder geometric glyph the LOGO task set out
    to remove. Deep Alpine Blue #173B63 (DESIGN-SYSTEM.md).

    A HEX IS ALLOWED HERE, where it was not in the placeholder, because this is
    now a real two-tone image asset rather than a currentColor placeholder - an
    .svg file is an image, not code, so the token rule that governs .tsx/.scss
    does not reach it. The kit's build.py is the source; regenerate there.

    THE COMMENT SITS INSIDE THE ROOT ELEMENT and width/height are explicit, for
    the reason the previous file recorded: Next's metadata image loader parsed
    neither otherwise. No gradient (R82); tests/unit/meta/no-gradients.test.ts
    names this file.
  -->
  <rect width="192" height="192" rx="44" fill="#173B63"/>
  <rect x="24" y="76" width="144" height="40" rx="20" fill="#FFFFFF" opacity="0.28"/>
  <rect x="24" y="76" width="40" height="40" rx="20" fill="#FFFFFF"/>
  <rect x="74" y="48" width="16" height="96" rx="8" fill="#FFFFFF"/>
</svg>
