name: ios-shared

# ===========================================================================
# IOS-0 (R530). :shared COMPILED FOR iOS, AND ITS commonTest RUN ON AN iPHONE
# SIMULATOR. One workflow, one job, no secrets.
# ===========================================================================
#
# WHAT IT PROVES. Six KMP tasks proved :shared platform-free by compiling it as
# COMMON METADATA on Windows. That rejects java.* and android.*; it does not
# prove the code compiles to native iOS, that Room's compiler generates an iOS
# implementation, that kotlinx-datetime finds Europe/Paris on iOS, or that the
# Geneva cases give the same answers on an iPhone. This job runs:
#
#   :shared:iosSimulatorArm64Test   commonTest compiled to native, linked into
#                                   a test executable and RUN on a simulator
#   :shared:compileKotlinIosArm64   commonMain (plus Room's generated code)
#                                   compiled for a real device
#
# NO SECRETS, NOTHING SIGNED. No Apple account, no certificate, no token: a
# simulator test binary and a device klib need neither. permissions is
# read-only and nothing here reads a secret or a repository variable.
#
# IT COSTS MONEY, SO IT RUNS ONLY WHEN ASKED. The repository is private and a
# standard macOS runner is billed per minute at roughly ten times the Linux
# rate (GitHub's own table: $0.062/min against $0.006/min, read 2026-10-24),
# against the same monthly allowance ci.yml spends. So it runs on:
#   - workflow_dispatch (GitHub dispatches only a workflow whose file is on the
#     DEFAULT branch, so this trigger works once the file is merged);
#   - a push to an ios-* branch - the only trigger available while the file
#     lives on its own branch, and deliberately narrow: no other branch, and
#     never main.
# A push that changes only a report or the park register starts nothing
# (paths-ignore). A newer push to the same branch cancels the run it
# supersedes (concurrency), and a hung simulator cannot bill past the job's
# timeout.
#
# ci.yml IS NOT TOUCHED and does not change behaviour because of this file.

on:
  workflow_dispatch:
  push:
    branches:
      - 'ios-*'
    paths-ignore:
      - 'REPORT-*.txt'
      - 'parking.md'

concurrency:
  group: ios-shared-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-shared-tests:
    name: ios-shared-tests
    # THE RUNNER, AND WHY THIS ONE (R530; re-read for Kotlin 2.2.21, KMP-UP2).
    #   - ARM64 IS REQUIRED, not merely faster. The Kotlin Gradle plugin's
    #     KotlinNativeTestRunFactories ENABLES iosSimulatorArm64Test only when
    #     the host's architecture equals the target's (`HostManager.hostIsMac &&
    #     HostManager.host.architecture == ...` - the same line at v2.1.10 and
    #     v2.2.21). On an Intel runner the task is disabled, exits 0 and runs
    #     ZERO tests - which is why the step after Gradle refuses a run with no
    #     results.
    #   - macos-15 (arm64, M1, 3 cores, 7 GB) and not macos-latest: a label that
    #     moves underneath a pinned toolchain is a version change nobody chose.
    #   - not macos-14: its images are deprecated and fully unsupported from
    #     2026-11-02 (actions/runner-images#13518).
    #   - macos-15 rather than macos-26, though both now carry the Xcode below:
    #     the macos-15-arm64 image (20260907.0337.1; actions/runner-images
    #     readme committed 2026-09-11) lists Xcode 26.0.1, 26.1.1, 26.2 and 26.3
    #     beside the 16.x line, so moving to Xcode 26 moves ONLY the Xcode -
    #     not the machine, its OS or the simulators iOS-0 measured on.
    #     macos-26-arm64 (20261013.0424.1) also lists 26.0.1 but defaults to
    #     26.6.
    #   - a STANDARD runner: larger runners cannot use the included minutes.
    runs-on: macos-15
    # A cold run downloads the Kotlin/Native toolchain and builds its caches
    # before compiling anything; this bounds a hang, not a normal run.
    timeout-minutes: 50
    env:
      # THE XCODE, AND WHY THIS ONE (KMP-UP2 R547). Apple requires Xcode 26
      # for App Store / TestFlight uploads (PARK-N4). Kotlin 2.2.21 is the first
      # Kotlin documented for it: "Starting with Kotlin 2.2.21, the
      # Kotlin/Native compiler supports Xcode 26" (What's new in Kotlin
      # 2.2.20), and the Kotlin Multiplatform compatibility table pairs 2.2.21
      # with Xcode 26.0. 26.0.1 (build 17A400) is this image's Xcode in that
      # 26.0 line - the table's version rather than the newest, the reasoning
      # iOS-0 applied to 16.x (iOS-0 ran 16.2 because 16.3+ conflicted with
      # Kotlin 2.1.x). macos-15's DEFAULT is still 16.4, so inheriting it would
      # not be Xcode 26 at all. Set at JOB level so xcrun, simctl and the
      # Kotlin Gradle plugin all see the same one; the diagnostic step prints
      # `xcodebuild -version` on every run.
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    defaults:
      run:
        working-directory: android

    steps:
      # Every action is pinned to the full commit SHA of a release, with the
      # release named beside it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout talks to the repository, so the job token is
          # not left in .git/config for the steps that follow.
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The open-source provider (a thin wrapper over actions/cache), not
          # the default "enhanced" one, which is a commercial component offered
          # to private repositories as a free preview.
          cache-provider: basic
          # The default is READ-ONLY on every branch but the default one, which
          # would make every ios-* run as cold as the first.
          cache-read-only: false

      # The Kotlin/Native compiler, its LLVM and its per-target caches live in
      # ~/.konan, which setup-gradle does not cover. Keyed on the version
      # catalog, so a Kotlin change starts a fresh cache. Restore and save are
      # separate steps because the combined action saves only when the job
      # SUCCEEDS - and the runs most likely to be followed by another are the
      # red ones.
      - name: Restore the Kotlin/Native toolchain
        id: konan
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('android/gradle/libs.versions.toml') }}

      # Printed BEFORE Gradle, so a red run still says which machine, which
      # Xcode, which simulators and which time-zone database it had. The Kotlin
      # Gradle plugin's XcodeDefaultTestDevicesValueSource (byte-identical at
      # v2.1.10 and v2.2.21) walks
      # `simctl list devices available` and keeps, for iOS, the first device
      # under EACH "-- iOS x --" heading, each overwriting the last - so the
      # device is the first one listed under the LAST iOS runtime.
      # kotlinx-datetime 0.6.1 on the simulator reads its zone rules from
      # /usr/share/zoneinfo.default (its darwinSimulator defaultTzdbPath).
      - name: Environment (diagnostic)
        run: |
          set +e
          uname -m
          sw_vers
          xcode-select -p
          xcodebuild -version
          java -version
          xcrun simctl list runtimes
          xcrun simctl list devices available
          ls -la /usr/share/zoneinfo /usr/share/zoneinfo.default
          echo "zoneinfo.default +VERSION: $(cat /usr/share/zoneinfo.default/+VERSION 2>/dev/null)"
          echo "/var/db/timezone/zoneinfo +VERSION: $(cat /var/db/timezone/zoneinfo/+VERSION 2>/dev/null)"
          exit 0

      # R532 CAUSE 1 (run 40107915183). On a machine with no ~/.konan, Room's
      # KSP task for an iOS target failed before anything compiled:
      #   kspKotlinIosSimulatorArm64 / kspKotlinIosArm64 FAILED
      #   java.lang.ClassNotFoundException: org.jetbrains.kotlin.cli.utilities.MainKt
      #   Can't find env_blacklist file at ~/.konan/kotlin-native-prebuilt-...
      # KSP registers its own KSP1 native task (KspTaskNative, KotlinFactories.kt
      # - in 2.1.10-1.0.31 and still in 2.2.21-2.0.4), which runs the
      # Kotlin/Native compiler from the toolchain directory but does not
      # PROVISION it; the Kotlin plugin's own native tasks do. KSP runs first,
      # so on a fresh machine the directory does not exist yet. The commonizer
      # is a Kotlin-plugin native task that provisions the toolchain
      # (NativeDistributionCommonizerTask), and :shared:commonize depends on
      # it. Nothing in :shared changes; no version changes. Kept on Kotlin
      # 2.2.21 because nothing has shown it unnecessary (PARK-N1).
      #
      # THIS IS ALSO THE FIRST STEP TO EXECUTE ./gradlew. The wrapper is tracked
      # executable (100755) since KMP-UP2 R539, so the chmod step iOS-0 needed
      # is gone and this step is its positive control: a lost mode fails here
      # with "Permission denied" instead of being repaired unseen.
      - name: Provision the Kotlin/Native toolchain
        run: |
          ./gradlew :shared:commonize --no-daemon --stacktrace
          if ! ls "$HOME"/.konan/kotlin-native-prebuilt-macos-*/tools/env_blacklist >/dev/null 2>&1; then
            echo "NO RESULT: the Kotlin/Native toolchain is still absent from ~/.konan after :shared:commonize."
            exit 1
          fi
          ls -d "$HOME"/.konan/kotlin-native-prebuilt-macos-*

      # THE SCRIPT (R530), with TWO additions, neither of which changes what
      # is compiled or run:
      #   --continue  a red test task does not stop compileKotlinIosArm64 from
      #               also reporting in the same paid run;
      #   --info      Gradle then logs the exact command each test process was
      #               started with, which is how the step after this one names
      #               the simulator from the machine rather than from the
      #               plugin's source. The output is also kept in a file for it.
      - name: iOS - simulator tests and device compile
        run: |
          set -o pipefail
          ./gradlew :shared:iosSimulatorArm64Test :shared:compileKotlinIosArm64 --no-daemon --stacktrace --continue --info 2>&1 | tee "$RUNNER_TEMP/gradle-ios.log"

      - name: Save the Kotlin/Native toolchain
        if: always() && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('android/gradle/libs.versions.toml') }}

      # ABSENCE NEEDS A POSITIVE CONTROL. A disabled or skipped test task
      # exits 0 with no results, which reads exactly like a pass. This step
      # reads the results the run produced, prints them per class, and FAILS
      # when there are none.
      - name: Results - refuse a run that executed no tests
        if: always()
        run: |
          dir=shared/build/test-results/iosSimulatorArm64Test
          if ! ls "$dir"/*.xml >/dev/null 2>&1; then
            echo "NO RESULT: no JUnit XML under android/$dir - the iOS tests did not run."
            exit 1
          fi
          total=0
          for f in "$dir"/*.xml; do
            line=$(grep -o '<testsuite [^>]*' "$f" | head -1)
            name=$(echo "$line" | sed -n 's/.* name="\([^"]*\)".*/\1/p')
            tests=$(echo "$line" | sed -n 's/.* tests="\([0-9]*\)".*/\1/p')
            failures=$(echo "$line" | sed -n 's/.* failures="\([0-9]*\)".*/\1/p')
            errors=$(echo "$line" | sed -n 's/.* errors="\([0-9]*\)".*/\1/p')
            skipped=$(echo "$line" | sed -n 's/.* skipped="\([0-9]*\)".*/\1/p')
            echo "$name tests=$tests failures=$failures errors=$errors skipped=$skipped"
            total=$((total + tests))
          done
          echo "iOS SIMULATOR TESTS EXECUTED: $total"
          echo "--- captured output (the Geneva cases print one line each, after their assertions):"
          grep -h "GENEVA case" "$dir"/*.xml || echo "NO RESULT: no GENEVA case line captured"
          if [ "$total" -eq 0 ]; then
            echo "NO RESULT: the XML exists but records zero tests."
            exit 1
          fi

      # WHICH SIMULATOR RAN THE TESTS, read from the command Gradle actually
      # started (logged at --info) rather than inferred from the plugin's
      # source. Two earlier versions read the device's files instead and both
      # found nothing to read - directory mtimes do not move, and `simctl spawn
      # --standalone` writes nothing into the device's data directory (runs
      # 40108753078 and 40109536305, both recorded as NO RESULT, not evidence).
      - name: Which simulator ran (positive signal)
        if: always()
        run: |
          set +e
          log="$RUNNER_TEMP/gradle-ios.log"
          cmd=$(grep -m1 "simctl spawn" "$log")
          if [ -z "$cmd" ]; then echo "NO RESULT: no 'simctl spawn' command in the Gradle log"; exit 0; fi
          echo "THE TEST PROCESS WAS STARTED AS:"
          echo "$cmd" | sed 's/ --ktest_.*//' | cut -c1-400
          udid=$(echo "$cmd" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -1)
          echo "DEVICE: $(xcrun simctl list devices | grep "$udid" | sed 's/^ *//')"
          echo "RUNTIME: $(xcrun simctl list devices | awk -v u="$udid" '/^-- /{h=$0} index($0,u){print h; exit}')"
          exit 0

      # What Room's compiler generated for each iOS target - the R400 question
      # ("unproven until a Mac") answered from the build directory itself.
      - name: Room's generated iOS code (listing)
        if: always()
        run: |
          find shared/build/generated/ksp -path '*ios*' -name '*.kt' 2>/dev/null | sort || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-shared-test-results
          path: |
            android/shared/build/test-results/
            android/shared/build/reports/
          retention-days: 14
          if-no-files-found: warn
