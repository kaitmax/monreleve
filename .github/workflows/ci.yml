name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: package.json carries packageManager, and
      # passing both makes the action fail with "multiple versions specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The order is the Definition of Done: cheapest signal first.
      - run: pnpm typecheck
      - run: pnpm lint

      # lib/ui/core/styles/_zones.scss is generated from zone-tokens.ts and
      # must not be hand-edited (SPEC section 20: "keep zones.ts the single
      # source"). --check compares byte for byte and never writes.
      #
      # It runs here as well as on prebuild so a drift reports as its own
      # named failure rather than as a test failure three steps later. Both
      # sit BEFORE pnpm build, which is the ordering that matters: if the
      # build regenerated the file, a hand edit would be overwritten before
      # anything could see it and no later check could ever fail.
      - run: pnpm zones:check
      # Ruling R22: the coverage run is a strict superset of pnpm test, so CI
      # runs it alone. pnpm test stays the local loop command, where the
      # faster uninstrumented run is worth having.
      #
      # SPEC 7.6: 100% statement and branch coverage on lib/calc-engine is
      # "not an aspiration". Blocking, and proven to bite - an unreachable
      # branch takes it to 98.79% and fails the step.
      - run: pnpm test:coverage
      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      # SPEC section 17: "A budget not enforced in CI is a budget that
      # silently disappears." Deliberately blocking - and deliberately last,
      # from when it was expected to be red.
      #
      # It is GREEN, and has been since FW2. Ruling R2 replaced the single
      # 100 KiB gate this comment used to describe with two: GATE A, 125 KiB
      # on first-load JS, and GATE B, a 25 KiB per-route delta. The stale
      # wording mattered because FW6's final verification runs the whole chain
      # and a reader trusting it would either record a false deviation or wave
      # through a genuine regression as expected. See REPORT-FW2.txt.
      - run: pnpm size

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # SPEC sections 19 and 21 make it a ship criterion that formatPercent and
  # formatDays render the same codepoints "on Node 22 and 24".
  #
  # Ruling R27 put the Node floor at 22. Node 20 left maintenance in April
  # 2026, before this ships, so the lane FW6 built to work around vitest's
  # exclusion of Node 20 now has a better job: keeping 22 and 24 honest
  # against ICU and CLDR drift, which is what actually moves a separator
  # codepoint.
  #
  # It stays its own pair of jobs rather than a matrix over `web`: a matrix
  # there would run build, playwright install, e2e and size on every leg,
  # collide on the playwright-report artifact name (upload-artifact@v4 fails
  # on a duplicate), and duplicate the required-check name for branch
  # protection.
  #
  # Compile the two formatter modules to plain JavaScript once, then run a
  # dependency-free codepoint check on each Node. The matrix legs install
  # NOTHING, so a leg cannot go red for a toolchain reason.
  format-parity-build:
    name: format parity (compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm parity:build

      - uses: actions/upload-artifact@v4
        with:
          name: format-parity-dist
          path: web/dist-parity/
          retention-days: 1

  format-parity:
    name: format parity (node ${{ matrix.node }})
    needs: format-parity-build
    runs-on: ubuntu-latest
    strategy:
      # Every version reports. Stopping at the first failure would hide
      # whether a difference is one version's or several.
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v4
        with:
          name: format-parity-dist
          path: web/dist-parity

      - run: node scripts/check-format-parity.mjs dist-parity
        working-directory: web
