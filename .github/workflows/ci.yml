name: CI

# ===========================================================================
# THE PUBLIC WINDOW - ONE VARIABLE, AND THIS IS IT
# ===========================================================================
#
# `CI_FULL` runs EVERYTHING: the web job, the Node parity matrix (R27), the
# runtime guard (R81) and the visual suite. It exists for the window in which
# this repository is public and Actions minutes are unlimited, so that three
# suites which have NEVER executed on a runner can execute (R213).
#
# TO GO BACK TO THE R201 BUDGET SPLIT, when the repository returns to private:
#
#     gh variable delete CI_FULL
#
# That is the whole revert. Every job falls back to the split below: `web` on
# push if CI_OCTOBER is on, the other three on workflow_dispatch only. Nothing
# else in this file changes, and the R201 minutes alarm re-arms by itself
# because it is gated on the repository being private.
#
# NOTHING HERE IS DATED, deliberately. A comment saying "remove this on 1
# November" is a comment nobody reads on 1 November; a variable that has to be
# deleted is a decision somebody makes.
#
# ===========================================================================
# R201 - THE OCTOBER BUDGET SPLIT. Written now, DISABLED now.
#
# The September 2026 Actions allowance is exhausted; the repository stays
# private; the allowance returns on 1 October at 2 000 minutes a month. From
# then on it is spent deliberately rather than on every push, because what CI
# provides is not "the tests pass" - pnpm gate:clone proves that on a fresh
# clone - but the answer to a different question: DOES THIS WORK ON A MACHINE
# THAT IS NOT MINE.
#
# THE SWITCH ON 1 OCTOBER IS ONE ACTION AND TOUCHES NO FILE:
#
#   gh variable set CI_OCTOBER --body on
#
# Every job below is gated on that repository variable. While it is unset the
# jobs are SKIPPED, and a skipped job consumes no minutes and produces no red
# run - which is why this file is still wired to `push` rather than commented
# out. Commenting the trigger would make the switch an edit, a review and a
# chance to get the YAML wrong at the moment CI is most needed.
#
#   gh variable set CI_OCTOBER --body off     reverts it, same one action
#
# WHAT RUNS ON PUSH (the clean-machine claim, ~8 minutes, about one run per
# task):
#   web - Postgres service, migrations, test:db, build, test:e2e, size.
#
# WHAT RUNS ON workflow_dispatch ONLY (deterministic, passes locally, worth
# checking at a checkpoint rather than continuously):
#   format parity matrix (R27), rail visual baselines, runtime guard (R81).
#
# WHAT NEVER RUNS IN CI:
#   the full visual suite. It runs in a container locally, and R114's zero
#   tolerance plus R184's tree-printing make it trustworthy where it runs.
#
# THE ALARM. The `web` job's first step prints the account's remaining Actions
# minutes and writes them to the run summary. BELOW 400 REMAINING the protocol
# reverts to gate:clone-only for the rest of the month - deliberately, and
# recorded in phase4parking.md, rather than discovered by a job refusing to
# start. A budget with no alarm is a budget you learn about the way this one
# was learnt: five commits pushed against a CI that had already stopped
# running, with nothing saying so until somebody looked.
# ===========================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    # R201: the one job worth paying for on every push to main. Skipped - at
    # no cost - until CI_OCTOBER is set.
    if: ${{ vars.CI_FULL == 'on' || vars.CI_OCTOBER == 'on' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    # FW14 is the first task with a database. The database suite is not
    # mocked - a unique constraint and what it does on a duplicate are
    # behaviours OF PostgreSQL, and a fake would assert our model of it -
    # so CI runs a real one.
    #
    # 5432 here, 5436 in docker-compose.yml: the runner's port is private to
    # the job, while a developer's machine already has other projects'
    # databases on the usual port.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frontalier
          POSTGRES_PASSWORD: frontalier
          POSTGRES_DB: frontalier
        ports:
          - 5432:5432
        # Starting the container is not the same as the database accepting
        # connections. Without the health check, migrations race the socket
        # and fail in a way that reads like a configuration error.
        options: >-
          --health-cmd "pg_isready -U frontalier -d frontalier"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://frontalier:frontalier@localhost:5432/frontalier?schema=public

    steps:
      # R201 - THE ALARM, AND IT IS THE FIRST STEP ON PURPOSE.
      #
      # September 2026 was learnt the expensive way: five commits pushed
      # against a CI that had already stopped running, with nothing saying so
      # until somebody opened the runs page. A budget with no alarm is a
      # budget you discover by a job refusing to start.
      #
      # BELOW 400 REMAINING the protocol reverts to gate:clone-only for the
      # rest of the month - a decision recorded in phase4parking.md, taken
      # deliberately rather than discovered.
      #
      # IT WARNS, IT DOES NOT FAIL. Failing the run that is telling you the
      # budget is low would spend more of the budget to say so, and would
      # bury the number under a red tick. The figure goes to the run summary
      # so the task report can quote it.
      #
      # R133 - IT SAYS WHEN IT COULD NOT READ. The billing endpoint needs a
      # token with the `Manage billing` scope, which GITHUB_TOKEN does not
      # carry by default. If the read fails, the step says exactly that
      # rather than printing nothing and reading as healthy. Supply
      # BILLING_TOKEN (a fine-grained PAT, read-only on billing) to enable
      # it.
      # R212: WHILE THE REPOSITORY IS PUBLIC, GITHUB_STEP_SUMMARY IS
      # WORLD-READABLE, and this step writes the account's Actions usage into
      # it - minutes used, minutes included, minutes remaining. That is not a
      # secret and Actions will not mask it: it is account information about
      # the operator, published to anyone who opens the run.
      #
      # SO IT DOES NOT RUN ON A PUBLIC REPOSITORY, and nothing is lost by
      # that: a public repository has UNLIMITED Actions minutes, so there is
      # no budget for an alarm to be about. The alarm exists for the private
      # window, which is where R201's 2 000-minute allowance applies.
      #
      # Found by the R212 audit before the public window was used, not after.
      - name: Actions minutes remaining (R201 alarm)
        if: ${{ github.event.repository.private }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.BILLING_TOKEN || github.token }}
        run: |
          set +e
          owner="${GITHUB_REPOSITORY%%/*}"
          json=$(gh api "users/$owner/settings/billing/actions" 2>/dev/null)

          if [ -z "$json" ]; then
            echo "::warning::R201 alarm could not read the Actions budget."
            {
              echo "### R201 budget alarm: UNREAD"
              echo ""
              echo "The billing endpoint returned nothing. GITHUB_TOKEN has no"
              echo "billing scope; set the BILLING_TOKEN secret to a fine-grained"
              echo "PAT with read-only billing access to enable this."
              echo ""
              echo "**This run is not evidence that the budget is healthy.**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          included=$(echo "$json" | jq -r '.included_minutes // 0')
          used=$(echo "$json" | jq -r '.total_minutes_used // 0')
          remaining=$(( included - used ))

          echo "Actions minutes: $used used of $included, $remaining remaining"
          {
            echo "### R201 budget alarm"
            echo ""
            echo "| used | included | remaining |"
            echo "|---|---|---|"
            echo "| $used | $included | **$remaining** |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$remaining" -lt 400 ]; then
            echo "::warning::Below 400 Actions minutes ($remaining). R201: revert to gate:clone-only for the rest of the month and record it in phase4parking.md."
            {
              echo ""
              echo "**BELOW 400.** R201 says: revert to \`gate:clone\`-only for the"
              echo "rest of the month, and record the decision in"
              echo "\`phase4parking.md\` rather than discovering it when a job"
              echo "refuses to start."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4

      # No version here on purpose: package.json carries packageManager, and
      # passing both makes the action fail with "multiple versions specified".
      # package_json_file is resolved from the REPOSITORY ROOT, not from the
      # job's working-directory - defaults.run only governs `run:` steps, not
      # action inputs. This repo has no root package.json (SPEC D1: one
      # package, no workspace), so without this path the action reports "No
      # pnpm version is specified" and the job dies before installing.
      # Found by the first CI run that ever executed, after R1 was cleared.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Ruling R63, the cheap half: `vitest list` collects WITHOUT executing,
      # so a broken include glob is reported here in seconds rather than after
      # the suite, and it names the canary file that stopped being collected.
      - run: pnpm test:floor

      # The order is the Definition of Done: cheapest signal first.
      - run: pnpm typecheck
      - run: pnpm lint

      # Ruling R22: the coverage run is a strict superset of pnpm test, so CI
      # runs it alone. pnpm test stays the local loop command, where the
      # faster uninstrumented run is worth having.
      #
      # SPEC 7.6: 100% statement and branch coverage on lib/calc-engine is
      # "not an aspiration". Blocking, and proven to bite - an unreachable
      # branch takes it to 98.79% and fails the step.
      - run: pnpm test:coverage

      # Ruling R63, the sharp half. The run above emits a JSON report as a
      # second reporter, so the RUNTIME test count is free here. It catches
      # what `vitest list` structurally cannot: a parametrised block whose
      # fixture array was emptied keeps its call site, so the static count is
      # unchanged while the tests are gone. Measured - emptying ZoneBadge's
      # status list left `list` at 426 call sites and took the real run from
      # 711 tests to 699.
      - run: pnpm test:floor -- --report test-results/vitest.json

      # FW14. Migrations are applied by the pipeline rather than by the
      # application at boot: a process that migrates on start will happily
      # migrate a production database from whatever version happens to be
      # deployed, and two instances starting together will do it twice.
      - run: pnpm db:deploy

      # tests/db/** is excluded from pnpm test on purpose - see
      # vitest.db.config.ts - so it is named here. R132's selector requires
      # it locally whenever prisma/**, lib/db/** or tests/db/** changes.
      #
      # FW21 ADDED TWO REQUIREMENTS ON THIS ROLE, and both are easy to remove
      # by accident while trying to tighten things up:
      #
      #   CREATE DATABASE. tests/db/fw14-era-migration.test.ts builds a real
      #   FW14-era database in a scratch database of its own, applies FW14's
      #   two migrations to it, inserts subscriber rows and only then runs
      #   `migrate deploy` - which is the only way to prove AC1's second half
      #   against rows that already exist rather than against an empty
      #   schema. POSTGRES_USER in the postgres image is a superuser, so this
      #   works as configured; a restricted role swapped in later would fail
      #   that file with "permission denied to create database".
      #
      #   The seed runs here. tests/db/demo-year.test.ts shells out to
      #   `prisma db seed`, because AC3 is about the COMMAND - a seed that
      #   works when called directly and fails through the CLI is a seed
      #   nobody can use. The seed refuses any host but localhost, which this
      #   job satisfies.
      - run: pnpm test:db

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      # SPEC section 17: "A budget not enforced in CI is a budget that
      # silently disappears." Deliberately blocking - and deliberately last,
      # from when it was expected to be red.
      #
      # It is GREEN, and has been since FW2. Ruling R2 replaced the single
      # 100 KiB gate this comment used to describe with two: GATE A, 125 KiB
      # on first-load JS, and GATE B, a 25 KiB per-route delta. The stale
      # wording mattered because FW6's final verification runs the whole chain
      # and a reader trusting it would either record a false deviation or wave
      # through a genuine regression as expected. See REPORT-FW2.txt.
      - run: pnpm size

      # RULING R129: THE ONE DEV-ENABLED BUILD. /dev/** is out of the
      # production build above, so GATE W and GATE I have nothing to measure
      # there - which is the point: a dev harness was costing the calculator
      # 1,6 KiB of chunk grouping. This builds the same tree with the routes
      # in, into its own distDir, and judges the two dev ceilings only. The
      # public rows it prints are NOT the shipped numbers and are not gated.
      - run: pnpm size:dev

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # Screenshot baselines, ruling R37: generated and compared ONLY inside the
  # Playwright Linux container, so one baseline set serves every machine.
  #
  # The JOB runs in that container (`container:` below), which is why the step
  # calls playwright directly instead of `pnpm test:visual` - that script
  # shells out to `docker run`, and inside the container it would be
  # docker-in-docker. Same image, same browser, same fonts, reached two ways.
  #
  # The image tag is pinned to the installed @playwright/test version. A
  # container whose browser differs from the one the baselines were made
  # against reintroduces exactly the drift R37 removes, so this tag and
  # web/package.json must move together.
  #
  # Its own job rather than a step in `web`: it builds and starts the app
  # again, and a font or rendering failure here should not be reported as the
  # unit suite going red.
  visual:
    name: rail visual baselines
    # R201: workflow_dispatch ONLY. Deterministic and run in the same
    # container locally; this is insurance against a runner difference.
    if: ${{ vars.CI_FULL == 'on' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # Chromium needs more than Docker's default 64 MB /dev/shm.
      options: --ipc=host
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright test --project=visual

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: visual-diff
          path: web/test-results/
          retention-days: 7

  # SPEC sections 19 and 21 make it a ship criterion that formatPercent and
  # formatDays render the same codepoints "on Node 22 and 24".
  #
  # Ruling R27 put the Node floor at 22. Node 20 left maintenance in April
  # 2026, before this ships, so the lane FW6 built to work around vitest's
  # exclusion of Node 20 now has a better job: keeping 22 and 24 honest
  # against ICU and CLDR drift, which is what actually moves a separator
  # codepoint.
  #
  # It stays its own pair of jobs rather than a matrix over `web`: a matrix
  # there would run build, playwright install, e2e and size on every leg,
  # collide on the playwright-report artifact name (upload-artifact@v4 fails
  # on a duplicate), and duplicate the required-check name for branch
  # protection.
  #
  # Compile the two formatter modules to plain JavaScript once, then run a
  # dependency-free codepoint check on each Node. The matrix legs install
  # RULING R118: the runtime guard runs in CI.
  #
  # pnpm test:runtime proves ruling R81's PRODUCTION behaviour - that
  # /sitemap.xml refuses with 503 rather than publishing localhost URLs, that
  # no canonical is emitted with no origin configured, and that the health
  # route answers where FW28 will point Coolify. It existed from FW10 and was
  # invoked by NOTHING: excluded from both Playwright projects by design,
  # holding its own config, named by no workflow and by no local command. The
  # FW12 audit found it. "A guard that hasn't run since FW10 is a guard we
  # don't have."
  #
  # ITS OWN JOB because it needs a server in a deliberately BROKEN
  # configuration - FRONTALIER_RUNTIME=1 with NEXT_PUBLIC_SITE_URL unset -
  # and every other suite needs one that works. playwright.runtime.config.ts
  # starts that server itself on port 3101 and sets both variables there
  # rather than trusting the ambient environment, so this job is install plus
  # one command.
  runtime-guard:
    name: runtime guard (R81)
    # R201: workflow_dispatch ONLY. Passes locally; checkpoint insurance.
    if: ${{ vars.CI_FULL == 'on' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
      # package_json_file resolves from the REPOSITORY ROOT, not from the
      # job's working-directory - see the note on format-parity-build.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:runtime

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: runtime-guard-report
          path: web/test-results/
          retention-days: 7

  # NOTHING, so a leg cannot go red for a toolchain reason.
  container:
    name: container (R249/R251)
    # RULING R251: a file that determines what runs, or whether it runs,
    # belongs to a suite. The Dockerfile, .dockerignore and
    # scripts/entrypoint.mjs decide what exists to run and whether it serves,
    # and until FW28 they matched no selector rule at all.
    #
    # IT RUNS IN CI RATHER THAN BEING DECLARED LOCAL-ONLY, and that is the
    # decision worth reading. Every entry in LOCAL_ONLY has a STRUCTURAL
    # reason CI cannot answer the question - test:visual:update writes
    # baselines, test:late needs a shared working tree, test:clean-tree needs
    # a dirty one. A container has none of those: CI can build and run it, and
    # doing so answers the question gate:clone was built to ask - does this
    # work on a machine that is not mine? - on a machine that is genuinely
    # not mine, with no store cache and no image layers.
    #
    # R250's refusal matrix is the fast half; the image facts are the rest.
    # No database, no browser, no rendered page: those belong to the suites
    # that already own them.
    if: ${{ vars.CI_FULL == 'on' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # THE SAME COMMAND THE GATE RUNS, not a paraphrase of it (R206). The
      # first version of this step called `node scripts/container-check.mjs`
      # directly with its own tag, and gate-covers-ci.test.ts refused it -
      # correctly: it maps CI steps to package scripts by name, so a step
      # that reproduces a script's body is a second definition of the suite
      # that can drift from the first.
      #
      # NO `pnpm install`. The check imports only Node built-ins, and the
      # image installs its own dependencies from the lockfile inside the
      # build - which is the claim being tested. An install here would prove
      # the runner works rather than that the image does.
      - run: pnpm test:container

  container-e2e:
    name: the suite against the image (R249)
    # `pnpm test:e2e` proves the SOURCE is correct. This proves the DEPLOYED
    # ARTEFACT is, and the two differ: standalone output rather than
    # node_modules, an apt Chromium, TZ=Europe/Paris in the process, and an
    # entrypoint that decides whether any of it runs.
    #
    # IT FOUND A PRODUCTION DEFECT ON ITS FIRST RUN. /api/alertes redirected to
    # an absolute URL built from request.nextUrl.origin, which inside the image
    # is http://0.0.0.0:3000 - an address no browser can follow. Four specs,
    # green against next start, failing against the image, and every
    # no-JavaScript subscriber sent nowhere.
    if: ${{ vars.CI_FULL == 'on' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frontalier
          POSTGRES_PASSWORD: frontalier
          POSTGRES_DB: frontalier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frontalier"
          --health-interval 2s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # THE DATABASE IS HANDED OVER rather than created. Locally the script
      # makes a scratch database inside the compose container; CI has a
      # `services: postgres` with no such container NAME, so it supplies one
      # and the script uses it as given. R251's principle: where a suite could
      # run in CI, the answer is a mechanism, not an exemption.
      - run: pnpm test:container:e2e
        env:
          CONTAINER_E2E_DATABASE_URL: postgresql://frontalier:frontalier@localhost:5432/frontalier?schema=public

      # TWO CONTAINERS, ONE DATABASE. `globalThis` is per-process, so replicas
      # are separate schedulers - and what matters is whether the WORK is
      # duplicated. Measured rather than reasoned (R249): N jobs enqueued, the
      # executions counted out of both containers' logs. It also fails when a
      # replica does NOTHING, because a correct total with an idle replica is
      # the shape of a lock nobody released - it looks exactly like success.
      - run: pnpm test:container:scheduler
        env:
          CONTAINER_SCHEDULER_DATABASE_URL: postgresql://frontalier:frontalier@localhost:5432/frontalier?schema=public

      # A BACKUP NOBODY HAS RESTORED IS A HOPE. pg_dump running nightly proves
      # a file is being written; it says nothing about whether that file can
      # be turned back into a database. This does the destructive half - dump,
      # DROP DATABASE, restore - and compares every row count.
      #
      # It needs no container, only a database, so it runs here rather than in
      # a job of its own.
      # The client binaries, because a supplied server means this talks to it
      # directly rather than through a compose container that CI does not have.
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm test:container:restore
        env:
          RESTORE_DATABASE_URL: postgresql://frontalier:frontalier@localhost:5432/frontalier?schema=public

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: container-e2e-report
          path: web/test-results/
          retention-days: 7

  format-parity-build:
    name: format parity (compile)
    # R201: workflow_dispatch ONLY. Feeds the Node matrix below.
    if: ${{ vars.CI_FULL == 'on' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
      # package_json_file is resolved from the REPOSITORY ROOT, not from the
      # job's working-directory - defaults.run only governs `run:` steps, not
      # action inputs. This repo has no root package.json (SPEC D1: one
      # package, no workspace), so without this path the action reports "No
      # pnpm version is specified" and the job dies before installing.
      # Found by the first CI run that ever executed, after R1 was cleared.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm parity:build

      - uses: actions/upload-artifact@v4
        with:
          name: format-parity-dist
          path: web/dist-parity/
          retention-days: 1

  format-parity:
    name: format parity (node ${{ matrix.node }})
    needs: format-parity-build
    # R201: workflow_dispatch ONLY. `needs` would skip this anyway when its
    # dependency skips, and that is exactly why it is written out - a reader
    # should not have to derive a job's trigger from another job's, and a
    # later edit that drops the `needs` would silently put the matrix back on
    # every push.
    if: ${{ vars.CI_FULL == 'on' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      # Every version reports. Stopping at the first failure would hide
      # whether a difference is one version's or several.
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v4
        with:
          name: format-parity-dist
          path: web/dist-parity

      - run: node scripts/check-format-parity.mjs dist-parity
        working-directory: web
