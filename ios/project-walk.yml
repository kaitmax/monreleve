# ios/project-walk.yml
#
# IOS-WALK (I2) R1344. THE WALK'S PROJECT: project.yml, included whole and unchanged (the one home of every app key,
# R206), PLUS one UI-test target and one scheme. .github/workflows/ios-walk.yml generates from THIS file; ios-app.yml
# still generates from project.yml, so the app's own build and probe run are untouched.
#
# THE DRIVER IS XCUITest, from Xcode itself: XCTest ships with Xcode, so the target adds no dependency (no package, no
# pod, no gradle or npm entry). The API base URL is NOT set here: the workflow overrides MONRELEVE_API_BASE_URL on the
# xcodebuild command line with the runner-local relay's address (R1340, one build setting - R1320's).

include:
  - project.yml

targets:
  MonReleveWalkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MonReleveWalkUITests
    dependencies:
      - target: MonReleve
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.monreleve.app.walkuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MonReleve
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  MonReleveWalk:
    build:
      targets:
        MonReleve: all
        MonReleveWalkUITests: [test]
    test:
      config: Debug
      targets:
        - MonReleveWalkUITests
