# ios/project.yml
#
# IOS-HOST R1211. THE iOS APP PROJECT, GENERATED - NEVER HAND-WRITTEN. `xcodegen generate` (run from this directory)
# writes MonReleve.xcodeproj, MonReleve/Info.plist and MonReleve/MonReleve.entitlements from this file; all three are
# gitignored (ios/.gitignore), so THIS file is the one home of every key below (R206). XcodeGen is a TOOL installed on
# the runner by brew (.github/workflows/ios-app.yml); nothing it generates is a dependency of the app.
#
# WHAT THE APP IS, TODAY (IOS-SHELL-1 R1320): a SwiftUI window hosting ONE ComposeUIViewController - the COMMON AppRoot
# around the common router, over the process's shell (:shared iosMain ios/MonReleveViewController.kt, IosShell.kt):
# sign-in by code, RESOLVING, the manual-only onboarding and the four tabs. It reads MonReleveApiBaseUrl and the version
# keys below from Info.plist. IOS-AUDIT R1350: every launch is the real app - the pilot is gone - and the runner's probes
# (MonReleve/Sources/HostProbe.swift under `-probe YES`, WalkProbe.swift under `-walkProbe YES`) are compiled ONLY in
# the Debug configuration (SWIFT_ACTIVE_COMPILATION_CONDITIONS below), so the Release build carries none of them (R1353
# inspects the built Release binary for their names).
#
# THE BUILD SHAPE (REPORT-IOS-HOST-CENSUS R1203):
#   - :shared is a STATIC framework, baseName "Shared" (android/shared/build.gradle.kts), linked into the app binary.
#   - The pre-build script runs :shared:embedAndSignAppleFrameworkForXcode. For a static framework that task's own
#     action (copy + codesign) is disabled, but its dependencies still run: the framework link, the symlink into
#     xcode-frameworks/, and Compose Multiplatform's syncComposeResourcesForIos, which writes the glyph files into
#     the .app's compose-resources/ - without it every icon lookup throws at run time. The workflow refuses an .app
#     with no compose-resources/ic_*.xml.
#   - ENABLE_USER_SCRIPT_SANDBOXING = NO: both the Kotlin and the Compose Gradle plugins refuse a sandboxed script.
#   - AD-HOC SIGNING, NO TEAM: identity "-", DEVELOPMENT_TEAM empty, code signing ALLOWED. On the simulator the
#     entitlements are simulated from the binary's __TEXT,__entitlements section; with signing disabled they are
#     reported to be stripped, and the Keychain then answers -34018 (IOS-1a R565).
#   - arm64 only: the workflow passes ARCHS=arm64, the one simulator architecture :shared declares
#     (iosSimulatorArm64); an x86_64 slice would ask the Kotlin plugin for a target that does not exist.

name: MonReleve

options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    # The iOS app's OWN version (the App Store's numbering, independent of Play's) - QUESTION in REPORT-IOS-HOST.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MonReleve:
    type: application
    platform: iOS
    sources:
      - path: MonReleve/Sources
      # IOS-AUDIT R1354: the privacy manifest, copied into the bundle as a resource (R1353's Release step asserts it is).
      - path: MonReleve/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: MonReleve
        PRODUCT_BUNDLE_IDENTIFIER: ch.monreleve.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../android/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
      configs:
        # The API base URL (Android: BuildConfig.API_BASE_URL). Debug reaches a server on the simulator's own host
        # loopback (Android's debug default is the emulator's 10.0.2.2:3000); Release is the site. IOS-SHELL-1 R1320:
        # the app's AuthApi reads it (MonReleveViewController.kt) - the ONE home, never a literal in code (R206). The
        # workflow LAUNCHES Debug only, so no run of it ever contacts production; IOS-AUDIT R1353 builds Release too, and
        # only reads it (ios-app.yml's Release step never installs or launches it).
        #
        # IOS-AUDIT R1350: DEBUG is defined for the Debug configuration ALONE, stated rather than inherited from a preset
        # (R345: a default is a setting nobody chose) - every probe file and launch argument sits under `#if DEBUG`.
        Debug:
          MONRELEVE_API_BASE_URL: "http://127.0.0.1:3000"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
        Release:
          MONRELEVE_API_BASE_URL: "https://monreleve.ch"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    info:
      path: MonReleve/Info.plist
      properties:
        CFBundleDisplayName: "Mon Relevé"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Compose Multiplatform 1.7.3 refuses to start without it (PlistSanityCheck.uikit.kt; R1203 item 3).
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        MonReleveApiBaseUrl: "$(MONRELEVE_API_BASE_URL)"
        # IOS-SHELL-2 R1333 (iOS Ruling 3 Q5): canOpenURL answers for a scheme only when it is listed here. "Ouvrir ma
        # messagerie" opens message:// and is hidden when nothing can (ios/IosUrlOpener.kt's MAIL_APP_URL). Nothing else
        # is listed.
        LSApplicationQueriesSchemes:
          - message
        # IOS-AUDIT R1350: NO BGTaskSchedulerPermittedIdentifiers and NO UIBackgroundModes. They were declared for the host
        # probe's bgtask check only (R1212 (4)); nothing in the shipped app registers a task, so they went with it. The
        # real background sync is PARK-IF1's, device-only, and declares its own when it exists.
    entitlements:
      path: MonReleve/MonReleve.entitlements
      properties:
        # The two entitlements the Keychain needs on the simulator (as android/shared/ios-test.entitlements gives the
        # test binary). No team: the prefix is whatever Xcode resolves for an unsigned-team build, and the workflow
        # prints the processed file.
        application-identifier: "$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"
        keychain-access-groups:
          - "$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"
    preBuildScripts:
      - name: "Kotlin framework and Compose resources (Gradle)"
        basedOnDependencyAnalysis: false
        # The runner's environment is public in a build log; nothing here needs it printed.
        showEnvVars: false
        script: |
          set -e
          cd "$SRCROOT/../android"
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode --stacktrace

schemes:
  MonReleve:
    build:
      targets:
        MonReleve: all
    run:
      config: Debug
