[versions]
agp = "8.10.1"
kotlin = "2.0.21"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.09.00"
# AN4 increment 1: made EXPLICIT rather than relied on transitively (it already
# ships via lifecycle-runtime-ktx). data/remote's transport wraps the platform
# HttpsURLConnection in withContext(Dispatchers.IO); R136 prefers the platform
# HTTP client, and this is only the concurrency primitive the app already uses,
# not an HTTP library. Pinned to match the version lifecycle 2.8.7 already brings.
coroutines = "1.8.1"
# KMP-0 increment 6 (R371/R136). kotlinx-datetime is the multiplatform calendar
# library the MOVED dossier/forecast code uses in place of java.time (which stays
# in :app). 0.6.1, not the 0.7.x line, chosen for two concrete reasons, not taste:
#   - 0.7.0 made DayOfWeek/Month multiplatform enums; through all of 0.6.x they are
#     typealiases to java.time.DayOfWeek/Month on the JVM target, so :app's existing
#     java.time.DayOfWeek rhythm keys and SimChange.ExtraWeekday cross the boundary
#     into the shared functions with NO conversion - the smallest-diff move (R368).
#   - the "mature stable, not bleeding edge" discipline the catalog applies to
#     work/kotest/browser: 0.6.x is a settled series, and this is a new dependency
#     on top of a new module (R156: one risky thing at a time).
# Compatible with Kotlin 2.0.21 (a regular multiplatform library, not a compiler
# plugin; its klib metadata is consumable by this compiler) and far more than two
# weeks old (released 2024-08, R371). VALIDATED EMPIRICALLY - it resolves and
# compileCommonMainKotlinMetadata + :shared tests are green on 2.0.21 - not trusted
# from a matrix (the AN2 Kotest discipline).
kotlinx-datetime = "0.6.1"
# AN5: KSP must start with the Kotlin version (compiler-plugin API); 1.0.28 is the
# last for Kotlin 2.0.21. Room 2.7.2 targets Kotlin 2.0 and recommends KSP2.
# Verified by web search (mvnrepository KSP, developer.android.com/room), not
# guessed - the AN2 Kotest 5.9.1 discipline.
ksp = "2.0.21-1.0.28"
room = "2.7.2"
# AN5 increment 3: the offline-queue drain. The relay mandates WorkManager
# ("network-constrained, with backoff"), and the server's own schema.ts names it
# ("WorkManager replays on connectivity"), so this is a task-required dependency,
# not an unplanned addition. 2.10.1 is a mature stable (not the 2.12.0 bleeding
# edge - the AN2 Kotest reasoning); CoroutineWorker is reachable through
# work-runtime-ktx whether or not a given release has emptied that artifact.
# Verified against developer.android.com/jetpack/androidx/releases/work.
work = "2.10.1"
# AN-LINKS (R136). Android Custom Tabs for the app -> website links: the page opens
# inside the app's context with the brand colour in the toolbar, rather than a bare
# browser hand-off. androidx.browser is THE AndroidX library for the Custom Tabs
# protocol (no Google Play Services, no account), and CustomTabsIntent + the toolbar
# colour it needs have existed since 1.2.0, so the feature needs nothing recent.
# 1.8.0, not the 1.10.0 latest stable (verified at developer.android.com/jetpack/
# androidx/releases/browser, fetched 2026-10-06): the mature stable that compiles
# against this project's compileSdk 35 with NO compileSdk bump - the same
# "mature stable, not bleeding edge" reasoning the catalog applies to work/kotest,
# and R156's conservative choice over an out-of-scope build-config change.
browser = "1.8.0"
ktlint = "12.1.1"
detekt = "1.23.7"
paparazzi = "1.3.5"
# AN2: last stable pre-6.x release. Kotest 6.0+ requires Kotlin 2.2 (kotest.io
# docs, release6) - this project is pinned to Kotlin 2.0.21 (AN1), so 6.x is
# not an option without a toolchain upgrade this task is not authorised to
# make. Verified via web search rather than guessed - see REPORT-AN2.txt.
kotest = "5.9.1"
# Bridges the existing JUnit 4 test files (CanaryTest.kt, RadiusTest.kt,
# ThemeCensusTest.kt, FencesTest.kt, the screenshot test) onto the JUnit
# Platform Kotest's own runner requires - without this, useJUnitPlatform()
# would silently stop running every JUnit-4-style test in the project, which
# is exactly the class of regression checkTestFloor exists to catch (R133).
junitVintage = "5.10.2"
# AN2, TEST-ONLY: android.jar's own org.json classes are stubbed to throw
# "not mocked" under plain JVM unit tests (testDebugUnitTest, not an
# instrumented test) - this is the real JVM implementation, used only to
# read fixtures/*.json, the same files the TypeScript engine reads directly.
jsonOrg = "20260814"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
kotest-runner-junit5 = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
kotest-property = { group = "io.kotest", name = "kotest-property", version.ref = "kotest" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junitVintage" }
json-org = { group = "org.json", name = "json", version.ref = "jsonOrg" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
# KMP-0 increment 6 (R371). The multiplatform calendar types for :shared commonMain
# (LocalDate, Instant, TimeZone, Clock, DayOfWeek) - java.time's replacement in the
# moved dossier/forecast code. Declared api() in :shared so :app sees these types
# transitively for the boundary mapping (the ONE pin; :app keeps java.time otherwise).
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }
# KMP-0 increment 1 (R368). The multiplatform common-test assertion library (kotlin.test), used by
# :shared's commonTest. Versioned with the Kotlin compiler (kotlin = 2.0.21) because kotlin-test ships
# in lockstep with the compiler, the same reasoning kotlin-reflect above follows.
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
# AN5: the offline record store. room-runtime + room-ktx (suspend DAO, Flow) in
# main; room-compiler runs under KSP; room-testing is androidTest-only, for the
# MigrationTestHelper harness R187 requires from the first version.
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# KMP-0 increment 1 (R368/R136). :shared is a Kotlin Multiplatform library with an Android target.
# The setup chosen is com.android.library + org.jetbrains.kotlin.multiplatform with androidTarget() -
# NOT the newer com.android.kotlin.multiplatform.library plugin. Why (R136 evidence, R156 conservative):
#   - this is the long-established, most-documented KMP+Android combination, stable across AGP 8.x and
#     Kotlin 2.0.x, so it adds no "bleeding edge" risk on top of the module being new (the AN2/AN5
#     mature-stable-not-latest discipline);
#   - its source-set names (androidMain, androidUnitTest) let the existing Kotest specs move into
#     :shared's Android unit-test source set unchanged (R373), and testDebugUnitTest runs them on the JVM;
#   - com.android.library reuses the SAME AGP 8.10.1 already on the classpath - no version bump (the hard
#     boundary), where com.android.kotlin.multiplatform.library would be a second, newer AGP component.
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
