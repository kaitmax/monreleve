[versions]
agp = "8.10.1"
# KMP-UP (R402-R409). MOVED FROM 2.0.21 FOR EXACTLY ONE REASON: Room 2.7.2's
# commonMain KLIB was produced by the 2.1.10 compiler and carries ABI version
# 1.201.0, which Kotlin 2.0.21's metadata compiler cannot read - it defaults to
# 1.8.0. KMP-2 stopped there. Room 2.7.1 and 2.7.0 fail identically, and the
# stdlib layer that IS pinnable is not the layer that blocks.
#
# KMP-UP chose 2.1.10 AND NOT NEWER: the compiler that built that klib, the
# smallest move that could work.
#
# KMP-UP2 (R539-R548). MOVED FROM 2.1.10 TO 2.2.21, the OLDEST Kotlin meeting all
# four of R540's conditions, each read from the publisher on 2026-10-24:
#   1. Xcode 26 (which Apple requires for App Store / TestFlight uploads): "Starting
#      with Kotlin 2.2.21, the Kotlin/Native compiler supports Xcode 26" (What's new
#      in Kotlin 2.2.20); the KMP compatibility table pairs 2.2.21 with Xcode 26.0
#      and 2.2.20 with Xcode 16.4.
#   2. Compose Multiplatform 1.10.x is declared for it ("Kotlin 2.2 is required for
#      native and web platforms"; 1.11 requires Kotlin 2.3).
#   3. KSP 2.2.21-2.0.4 runs in the CURRENT mode, KSP1 (see the ksp comment).
#   4. Released 2025-10-23 - a year, not two weeks.
# AGP 8.10.1 and Gradle 8.11.1 sit inside 2.2.21's documented ranges (AGP
# 7.3.1-8.11.1, Gradle 7.6.3-8.14), which is why nothing else had to move. 2.2.21 is
# also the LAST Kotlin with a KSP1-capable KSP: the next Kotlin move is a KSP-mode
# decision too. The Compose and serialization COMPILER PLUGINS track this ref and
# move with it by themselves; nothing else in this file moved.
kotlin = "2.2.21"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
# IOS-1b-A R625: MOVED FROM 2024.09.00 (Compose 1.7.0, Material3 1.3.0) TO 2024.12.01 (Compose 1.7.6,
# Material3 1.3.1) - the patch versions Compose Multiplatform 1.7.3 (below) resolves on Android anyway, so the
# BOM states what the app runs instead of a version conflict resolution overrides (REPORT-IOS-1b-A
# UNNUMBERED-4). The operator approved this patch move (R625) because all 142 Paparazzi baselines verify
# against it unchanged, at maxPercentDifference 0.0 (R626).
composeBom = "2024.12.01"
# IOS-1b-A R625 (R600, R624). Compose Multiplatform, for the shared Aujourd'hui screen. 1.7.3, NOT 1.10.3:
#   - CMP 1.10.3 moves Android's Compose to 1.10.5 and Material3 to 1.5.0-alpha08, and Paparazzi 1.3.5
#     cannot render Compose UI 1.10 text (NoSuchMethodError StaticLayout$Builder.setUseBoundsForWidth) -
#     REPORT-IOS-1b-A R601;
#   - CMP 1.7.3's Android variants ARE androidx Compose 1.7.6 / Material3 1.3.1: a patch move, pixel-identical
#     on all 142 baselines;
#   - R624's probe (run 40408680643): on the iOS simulator, Kotlin 2.2.21 + CMP 1.7.3 created a composition
#     with Aujourd'hui's Material3 surface, in a test scene and in a UIViewController.
# KNOWN BREAK, fenced: Material3 1.7.3's calendar model was compiled against kotlinx-datetime 0.6.0 and is
# UNLINKED on iOS against 0.7.1 (IrLinkageError: kotlinx.datetime/Instant.Companion) - no shared UI may use
# Material3's date pickers; a canary test asserts the break until it disappears.
# PARKED (REPORT-IOS-1b-A): the move to CMP 1.10+/1.11 when Material3 1.5 is STABLE and a Paparazzi release
# renders it - then a normal toolkit upgrade with a full baseline review.
compose-multiplatform = "1.7.3"
# AN4 increment 1: made EXPLICIT rather than relied on transitively (it already
# ships via lifecycle-runtime-ktx). data/remote's transport wraps the platform
# HttpsURLConnection in withContext(Dispatchers.IO); R136 prefers the platform
# HTTP client, and this is only the concurrency primitive the app already uses,
# not an HTTP library. Pinned to match the version lifecycle 2.8.7 already brings.
coroutines = "1.8.1"
# KMP-0 increment 6 (R371/R136). kotlinx-datetime is the multiplatform calendar
# library the MOVED dossier/forecast code uses in place of java.time (which stays
# in :app). 0.6.1, not the 0.7.x line, chosen for two concrete reasons, not taste:
#   - 0.7.0 made DayOfWeek/Month multiplatform enums; through all of 0.6.x they are
#     typealiases to java.time.DayOfWeek/Month on the JVM target, so :app's existing
#     java.time.DayOfWeek rhythm keys and SimChange.ExtraWeekday cross the boundary
#     into the shared functions with NO conversion - the smallest-diff move (R368).
#   - the "mature stable, not bleeding edge" discipline the catalog applies to
#     work/kotest/browser: 0.6.x is a settled series, and this is a new dependency
#     on top of a new module (R156: one risky thing at a time).
# Compatible with Kotlin 2.0.21 (a regular multiplatform library, not a compiler
# plugin; its klib metadata is consumable by this compiler) and far more than two
# weeks old (released 2024-08, R371). VALIDATED EMPIRICALLY - it resolves and
# compileCommonMainKotlinMetadata + :shared tests are green on 2.0.21 - not trusted
# from a matrix (the AN2 Kotest discipline). Still 0.6.1 on Kotlin 2.2.21 (KMP-UP2):
# the hard boundary keeps it, and the 2.2.21 compiler builds and tests against it on
# the JVM and on the iOS simulator. 0.7.x stays a task of its own (R384's inventory).
#
# KMP-DT (R550, R590): MOVED TO 0.7.1, the version Compose Multiplatform 1.10.3's
# Material3 (1.10.0-alpha05) requires - its common and iOS variants declare
# kotlinx-datetime {"requires":"0.7.1"}, and with 0.6.1 they forced 0.7.1 onto
# :shared's iOS configurations anyway. Released 2025-07-07. The regular artifact, NOT
# 0.7.1-0.6.x-compat: 0.7.0 replaced kotlinx.datetime.Instant/Clock with
# kotlin.time.Instant/Clock, which Kotlin 2.2.21 marks @ExperimentalTime (stable,
# unchanged, from Kotlin 2.3.0). The operator ruled the narrow opt-in (R590) over the
# compatibility artifact, whose java.time converter is internal and whose Instant is
# deprecated. Every @OptIn(ExperimentalTime) sits on a function, property or
# expression in a file on ExperimentalTimeOptInAllowlistTest's list; never file- or
# module-wide. PARK-Z3 deletes them, and that test, at the Kotlin 2.3 move. DayOfWeek
# and Month are no longer java.time typealiases on the JVM: :app converts at its
# boundary with the library's toKotlinDayOfWeek / toJavaDayOfWeek.
kotlinx-datetime = "0.7.1"
# KMP-1 increment 1 (R380/R136). kotlinx.serialization is the multiplatform JSON
# runtime the MOVED wire code (data/remote, the data/sync wire DTOs, the dossier
# parse) uses in place of org.json - a JVM library, which is the ONE thing holding
# those already-platform-neutral files back from commonMain. org.json STAYS in :app
# for the files that stay (BorderPolygon, Settings, detection assets - R379).
# 1.7.3, not the 1.8.x line, chosen for one concrete reason, not taste:
#   - 1.8.0-RC moved to Kotlin 2.1.0 (the kotlinx.serialization CHANGELOG); through
#     all of 1.7.x the runtime is built against and compatible with Kotlin 2.0.x.
#     This project WAS pinned to Kotlin 2.0.21 when that was written, which made
#     1.7.3 the highest runtime available with no toolchain bump. KMP-UP (2.1.10)
#     and KMP-UP2 (2.2.21) moved the compiler, so that particular ceiling is gone -
#     and 1.7.3 STAYS, because both tasks' hard boundary moves Kotlin and KSP and
#     nothing else. The 2.2.21 serialization plugin compiles against it and KMP-1's
#     wire goldens pass unedited (KMP-UP2 R545). The reason to revisit it is now the
#     second argument below, not this one.
#   - the "mature stable, not bleeding edge" discipline the catalog applies to
#     datetime/work/kotest/browser: 1.7.3 is the settled last-of-line for 2.0.x.
# Released 2024-10 (far more than two weeks old, R380). Verified via the
# kotlinx.serialization CHANGELOG (1.8.0-RC "based on Kotlin 2.1.0"; 1.7.3 "uses
# Kotlin 2.0.20 by default"), not guessed - the AN2 Kotest-5.9.1 discipline. The
# serialization COMPILER PLUGIN is pinned to the Kotlin version in [plugins] below,
# because it ships in lockstep with the compiler (as kotlin-reflect/kotlin-test do).
kotlinx-serialization = "1.7.3"
# AN5: KSP must start with the Kotlin version (compiler-plugin API).
#
# The hard boundary forbids changing the KSP MODE (KSP1). The 2.0.x releases (from
# 2.1.20-2.0.0) are NOT KSP2-only - read from KSP's own source rather than inferred
# from the version number: their Gradle plugin keeps KSP1 and flips only the
# DEFAULT ("enabled KSP2 by default", 2.1.20-2.0.0 release notes;
# useKsp2.convention(... orElse(true)) in KspSubplugin.kt). So the mode is pinned by
# ksp.useKSP2=false in gradle.properties, not by a line whose default happens to
# match. Verified after the move: :shared:help --task kspDebugKotlinAndroid still
# reports KspTaskJvm (KSP1), and the iOS tasks KspTaskNative.
#
# KMP-UP2: 2.2.21-2.0.4 (published 2025-10-28) is the first stable KSP for Kotlin
# 2.2.21 - the version prefix must equal the compiler's or KSP1 warns that it is
# too old or too new. 2.2.21-2.0.5 (2026-02-02) differs from it by ONE change, a
# gradle property that mutes KSP1's deprecation warning (google/ksp compare
# 2.2.21-2.0.4...2.2.21-2.0.5: "Remove KSP1 deprecation warning logic"). Muting a
# warning is forbidden here, so 2.0.5 would buy nothing but the means to break that
# rule. Read off google/ksp's releases and Maven Central, not recalled.
#
# KSP1 IS DEPRECATED AND THIS VERSION SAYS SO on every configuration: "We noticed
# you are using KSP1 which is deprecated ... KSP1 will no longer be compatible with
# Android Gradle Plugin 9.0.0 (and above) and Kotlin 2.3.0 (and above)". KSP's own
# ksp2.md at this tag: "KSP1 will not fully support Kotlin 2.2". The warning is
# left visible and asked about (REPORT-KMP-UP2 QUESTIONS), never muted: its only fix
# is the mode change the boundary forbids. KSP 2.3.x - the only KSP for Kotlin 2.3 -
# is KSP2-only.
ksp = "2.2.21-2.0.4"
room = "2.7.2"
# IOS-1a R567 (the operator approved this ONE dependency, REPORT-KMP-UP2 R548): the bundled SQLite driver, on iOS
# source sets only. 2.5.2 is the androidx.sqlite line room-runtime 2.7.2 itself depends on, so no version moves.
androidx-sqlite = "2.5.2"
# AN5 increment 3: the offline-queue drain. The relay mandates WorkManager
# ("network-constrained, with backoff"), and the server's own schema.ts names it
# ("WorkManager replays on connectivity"), so this is a task-required dependency,
# not an unplanned addition. 2.10.1 is a mature stable (not the 2.12.0 bleeding
# edge - the AN2 Kotest reasoning); CoroutineWorker is reachable through
# work-runtime-ktx whether or not a given release has emptied that artifact.
# Verified against developer.android.com/jetpack/androidx/releases/work.
work = "2.10.1"
# AN-LINKS (R136). Android Custom Tabs for the app -> website links: the page opens
# inside the app's context with the brand colour in the toolbar, rather than a bare
# browser hand-off. androidx.browser is THE AndroidX library for the Custom Tabs
# protocol (no Google Play Services, no account), and CustomTabsIntent + the toolbar
# colour it needs have existed since 1.2.0, so the feature needs nothing recent.
# 1.8.0, not the 1.10.0 latest stable (verified at developer.android.com/jetpack/
# androidx/releases/browser, fetched 2026-10-06): the mature stable that compiles
# against this project's compileSdk 35 with NO compileSdk bump - the same
# "mature stable, not bleeding edge" reasoning the catalog applies to work/kotest,
# and R156's conservative choice over an out-of-scope build-config change.
browser = "1.8.0"
ktlint = "12.1.1"
detekt = "1.23.7"
paparazzi = "1.3.5"
# AN2: last stable pre-6.x release. Kotest 6.0+ requires Kotlin 2.2 (kotest.io
# docs, release6) - this project was pinned to Kotlin 2.0.21 (AN1), so 6.x was
# not an option without a toolchain upgrade AN2 was not authorised to make.
# Verified via web search rather than guessed - see REPORT-AN2.txt.
# KMP-UP2 moved Kotlin to 2.2.21, so THAT reason no longer binds as written.
# 5.9.1 STAYS because KMP-UP2's hard boundary moves Kotlin and KSP and nothing
# else; it runs unchanged on 2.2.21 (the :app test floor is the same count).
# Revisiting it is its own task, not a side effect of this one.
kotest = "5.9.1"
# Bridges the existing JUnit 4 test files (CanaryTest.kt, RadiusTest.kt,
# ThemeCensusTest.kt, FencesTest.kt, the screenshot test) onto the JUnit
# Platform Kotest's own runner requires - without this, useJUnitPlatform()
# would silently stop running every JUnit-4-style test in the project, which
# is exactly the class of regression checkTestFloor exists to catch (R133).
junitVintage = "5.10.2"
# AN2, TEST-ONLY: android.jar's own org.json classes are stubbed to throw
# "not mocked" under plain JVM unit tests (testDebugUnitTest, not an
# instrumented test) - this is the real JVM implementation, used only to
# read fixtures/*.json, the same files the TypeScript engine reads directly.
jsonOrg = "20260814"
# AN-FCM-CLIENT (R1150, Android Ruling 4). The Firebase Cloud Messaging CLIENT, :app ONLY - the one artefact that
# receives FCM messages and yields a registration token. No BoM: one Firebase artefact needs no version
# alignment, and a BoM would make the version a second file's fact. NOT firebase-analytics, NOT crashlytics,
# NOT the google-services Gradle plugin (FirebaseApp is built from FirebaseOptions, push/PushConfig.kt).
# 26.0.2 is the newest stable on Google Maven, read 2026-11-20 (published 2026-11-11); its AARs declare
# minCompileSdk 1 and minSdk 24, inside this app's compileSdk 35 / minSdk 26.
firebaseMessaging = "26.0.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
# IOS-1b-A R625. Compose Multiplatform 1.7.3 for :shared commonMain (see the version's comment). On Android
# each resolves to the androidx artifact of the same name (runtime/ui/foundation/animation 1.7.6, material3
# 1.3.1) - the same classes :app already uses, not a second Compose.
cmp-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "compose-multiplatform" }
cmp-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "compose-multiplatform" }
cmp-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "compose-multiplatform" }
cmp-animation = { group = "org.jetbrains.compose.animation", name = "animation", version.ref = "compose-multiplatform" }
cmp-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "compose-multiplatform" }
# IOS-1b-A R603: Compose Multiplatform resources - how iOS draws the app's Lucide glyphs (design/Glyph.kt). Android
# does not read them (its glyphs stay the app's own drawables); the library's Android ContentProvider is removed
# from the merged manifest (app/src/main/AndroidManifest.xml), so it starts nothing there.
cmp-components-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "compose-multiplatform" }
# IOS-1b-A R606: Compose Multiplatform's UI-test API, iOS TEST scope only - runComposeUiTest composes and drives the
# shared screen on the simulator (R624 proved it runs there). Android keeps its own androidx ui-test-junit4.
cmp-ui-test = { group = "org.jetbrains.compose.ui", name = "ui-test", version.ref = "compose-multiplatform" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
kotest-runner-junit5 = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
kotest-property = { group = "io.kotest", name = "kotest-property", version.ref = "kotest" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junitVintage" }
json-org = { group = "org.json", name = "json", version.ref = "jsonOrg" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
# KMP-0 increment 6 (R371). The multiplatform calendar types for :shared commonMain
# (LocalDate, Instant, TimeZone, Clock, DayOfWeek) - java.time's replacement in the
# moved dossier/forecast code. Declared api() in :shared so :app sees these types
# transitively for the boundary mapping (the ONE pin; :app keeps java.time otherwise).
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }
# KMP-0 increment 1 (R368). The multiplatform common-test assertion library (kotlin.test), used by
# :shared's commonTest. Versioned with the Kotlin compiler (the kotlin ref above) because kotlin-test ships
# in lockstep with the compiler, the same reasoning kotlin-reflect above follows.
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
# KMP-1 increment 1 (R380). The multiplatform JSON runtime for :shared commonMain -
# org.json's replacement in the moved wire code. Declared implementation() in :shared
# (NOT api, unlike kotlinx-datetime), so it is NOT leaked onto :app's compile
# classpath: :app's remaining code keeps org.json and never sees kotlinx.serialization,
# while the moved files (now in :shared) use it. It still reaches :app's RUNTIME
# classpath transitively, so the release APK carries it and R8 processes it
# (checkMinifiedWireContract, R307).
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# AN5: the offline record store. room-runtime + room-ktx (suspend DAO, Flow) in
# main; room-compiler runs under KSP; room-testing is androidTest-only, for the
# MigrationTestHelper harness R187 requires from the first version.
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "androidx-sqlite" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging", version.ref = "firebaseMessaging" }

[plugins]
# IOS-1b-A R625. The Compose Multiplatform Gradle plugin: its resources (Res, painterResource on every target)
# are how the shared screen's icons reach both platforms (R603).
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-application = { id = "com.android.application", version.ref = "agp" }
# KMP-0 increment 1 (R368/R136). :shared is a Kotlin Multiplatform library with an Android target.
# The setup chosen is com.android.library + org.jetbrains.kotlin.multiplatform with androidTarget() -
# NOT the newer com.android.kotlin.multiplatform.library plugin. Why (R136 evidence, R156 conservative):
#   - this is the long-established, most-documented KMP+Android combination, stable across AGP 8.x and
#     Kotlin 2.0.x, so it adds no "bleeding edge" risk on top of the module being new (the AN2/AN5
#     mature-stable-not-latest discipline);
#   - its source-set names (androidMain, androidUnitTest) let the existing Kotest specs move into
#     :shared's Android unit-test source set unchanged (R373), and testDebugUnitTest runs them on the JVM;
#   - com.android.library reuses the SAME AGP 8.10.1 already on the classpath - no version bump (the hard
#     boundary), where com.android.kotlin.multiplatform.library would be a second, newer AGP component.
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# KMP-1 increment 1 (R380/R136). The kotlinx.serialization compiler plugin, applied to
# :shared only. Pinned to the Kotlin version (the kotlin ref) because the serialization plugin
# ships in lockstep with the compiler - a plugin built for another compiler cannot run
# in this one. It generates the @Serializable serializers the moved wire DTOs use; the
# runtime library (kotlinx-serialization-json) is versioned independently above.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
